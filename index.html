<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b2475d">
  <title>月次帳簿ノート</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top-bar">
    <div class="title-block">
      <h1>月次帳簿ノート</h1>
      <p id="saveStatus" class="save-status">最終保存時刻: 未保存</p>
    </div>
    <span id="lockBadge" class="lock-badge" hidden>確定済み</span>
  </header>

  <main class="app-shell">
    <section class="sheet-toolbar" aria-label="対象月と操作">
      <div class="period-controls">
        <label>
          <span>年</span>
          <input id="yearInput" type="number" inputmode="numeric" min="2000" max="2100">
        </label>
        <label>
          <span>月</span>
          <select id="monthSelect">
            <option value="01">1月</option>
            <option value="02">2月</option>
            <option value="03">3月</option>
            <option value="04">4月</option>
            <option value="05">5月</option>
            <option value="06">6月</option>
            <option value="07">7月</option>
            <option value="08">8月</option>
            <option value="09">9月</option>
            <option value="10">10月</option>
            <option value="11">11月</option>
            <option value="12">12月</option>
          </select>
        </label>
      </div>
      <nav class="tabs" aria-label="表示切替">
        <button id="ledgerTab" type="button" class="active" aria-controls="ledgerView">帳簿</button>
        <button id="accountsTab" type="button" aria-controls="accountsView">科目</button>
        <button id="backupTab" type="button" aria-controls="backupView">保存</button>
      </nav>
      <div class="compact-actions">
        <button id="addRowButton" type="button">行追加</button>
        <button id="sortByDateButton" type="button">日付順</button>
        <button id="printButton" type="button">印刷/PDF</button>
        <button id="csvButton" type="button">CSV</button>
      </div>
      <div class="lock-actions">
        <button id="toggleLockButton" type="button">確定</button>
        <button id="deleteMonthButton" type="button" class="danger">全削除</button>
      </div>
    </section>

    <section id="ledgerView" class="view active" aria-label="帳簿入力">
      <div id="lockedNotice" class="notice" hidden>この月は確定済みです。編集する場合はロックを解除してください。</div>
      <div id="accountSuggest" class="account-suggest" hidden></div>
      <div class="ledger-scroll" aria-label="帳簿表 横スクロール可">
        <table class="ledger-table">
          <colgroup>
            <col class="col-date">
            <col class="col-account">
            <col class="col-amount">
            <col class="col-account">
            <col class="col-sub">
            <col class="col-amount">
            <col class="col-summary">
            <col class="col-actions">
          </colgroup>
          <thead>
            <tr>
              <th>日付</th>
              <th>借方</th>
              <th>金額</th>
              <th>貸方</th>
              <th>補助科目</th>
              <th>金額</th>
              <th>摘要</th>
              <th class="no-print">↕</th>
            </tr>
          </thead>
          <tbody id="rowsContainer"></tbody>
        </table>
      </div>
      <p id="emptyState" class="empty-state" hidden>行追加を押すと、帳簿の下に1行増えます。</p>
    </section>

    <section id="accountsView" class="view" aria-label="勘定科目登録">
      <form id="accountForm" class="account-form">
        <label>
          <span>勘定科目</span>
          <input id="accountInput" type="text" autocomplete="off" placeholder="例: 通信費">
        </label>
        <button type="submit">追加</button>
      </form>
      <ul id="accountsList" class="accounts-list"></ul>
    </section>

    <section id="backupView" class="view" aria-label="バックアップ">
      <div class="backup-actions">
        <button id="backupButton" type="button">ledger-backup.json を保存</button>
        <label class="file-button">
          ledger-backup.json から復元
          <input id="restoreInput" type="file" accept="application/json,.json">
        </label>
      </div>
      <p class="hint">普段は端末内に自動保存します。バックアップと復元は手動操作だけです。</p>
    </section>
  </main>

  <section id="printArea" class="print-area" aria-label="印刷用帳簿">
    <h2 id="printTitle">月次帳簿</h2>
    <table>
      <thead>
        <tr>
          <th>日付</th>
          <th>借方</th>
          <th>金額</th>
          <th>貸方</th>
          <th>補助科目</th>
          <th>金額</th>
          <th>摘要</th>
        </tr>
      </thead>
      <tbody id="printRows"></tbody>
    </table>
  </section>

  <script src="app.js" defer></script>
</body>
</html>
